name: worker

# 🔄 recheck marker: 2026-10-25T16:55Z — key বদলালে এটা বদলালেই আবার যাচাই হবে

# ☁️ Cloudflare Worker — সম্পূর্ণ অটো ডিপ্লয়
#
# 🔑 যেকোনো ধরনের key চলবে, নাম যা-ই হোক:
#     • API Token      (৪০ অক্ষর)                    → Bearer
#     • Global API Key (৩৭ অক্ষর hex) + email          → X-Auth-Key
#   প্রার্থী: CF_API_KEY, CF_API_TOKEN, CLOUDFLARE_API_KEY,
#            CLOUDFLARE_API_TOKEN, ADMISSIONSKY_CLOUDFLARE_API_KEY
#   email : CF_EMAIL, CLOUDFLARE_EMAIL, ADMISSIONSKY_CLOUDFLARE_EMAIL
#
# 🧠 সব প্রার্থী একটা একটা করে **আসলেই যাচাই** করা হয়, তারপর যেটা কাজ করে সেটাই ব্যবহার হয়।
#    (পুরনো/ভুল key পড়ে থাকলেও আর আটকাবে না)
#
# তারপর নিজেই — টেস্ট → deploy → provider key বসানো → server.json → /api/health যাচাই।

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  schedule:
    - cron: "37 */6 * * *" # প্রতি ৬ ঘণ্টায় আবার চেষ্টা
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ---------- 🔑 কাজ করা key খুঁজে নাও ----------
      - name: কাজ করা Cloudflare key খুঁজে নাও
        id: pick
        env:
          K1: ${{ secrets.CF_API_KEY }}
          K2: ${{ secrets.CF_API_TOKEN }}
          K3: ${{ secrets.CLOUDFLARE_API_KEY }}
          K4: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          K5: ${{ secrets.ADMISSIONSKY_CLOUDFLARE_API_KEY }}
          E1: ${{ secrets.CF_EMAIL }}
          E2: ${{ secrets.CLOUDFLARE_EMAIL }}
          E3: ${{ secrets.ADMISSIONSKY_CLOUDFLARE_EMAIL }}
          A1: ${{ secrets.CF_ACCOUNT_ID }}
          A2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          A3: ${{ secrets.ADMISSIONSKY_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          BASE = "https://api.cloudflare.com/client/v4"
          CANDIDATES = [
              ("CF_API_KEY", os.environ.get("K1", "")),
              ("CF_API_TOKEN", os.environ.get("K2", "")),
              ("CLOUDFLARE_API_KEY", os.environ.get("K3", "")),
              ("CLOUDFLARE_API_TOKEN", os.environ.get("K4", "")),
              ("ADMISSIONSKY_CLOUDFLARE_API_KEY", os.environ.get("K5", "")),
          ]
          EMAILS = [os.environ.get(k, "").strip() for k in ("E1", "E2", "E3")]
          EMAIL = next((e for e in EMAILS if e), "")
          ACC = next((os.environ.get(k, "").strip() for k in ("A1", "A2", "A3")
                      if os.environ.get(k, "").strip()), "")

          def req(path, headers):
              r = urllib.request.Request(BASE + path, headers={"Content-Type": "application/json", **headers})
              try:
                  with urllib.request.urlopen(r, timeout=25) as resp:
                      return json.loads(resp.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try:
                      return json.loads(e.read().decode() or "{}")
                  except Exception:
                      return {"success": False, "errors": [{"message": f"HTTP {e.code}"}]}
              except Exception as exc:  # noqa: BLE001
                  return {"success": False, "errors": [{"message": str(exc)[:120]}]}

          lines, chosen = [], None
          for name, value in CANDIDATES:
              value = (value or "").strip()
              if not value:
                  lines.append(f"- {name}: নেই")
                  continue
              shape = f"{len(value)} অক্ষর"
              if len(value) == 37 and all(c in "0123456789abcdefABCDEF" for c in value):
                  shape += " (Global API Key-এর মতো)"
              elif len(value) == 40:
                  shape += " (API Token-এর মতো)"
              print(f"::add-mask::{value}")
              # ১) Bearer token হিসেবে
              data = req("/user/tokens/verify", {"Authorization": f"Bearer {value}"})
              ok = bool(data.get("success")) and (data.get("result") or {}).get("status") == "active"
              if ok:
                  lines.append(f"- {name}: ✅ WORK (Bearer API Token, {shape})")
                  chosen = {"name": name, "value": value, "mode": "bearer", "email": "", "account": ACC}
                  break
              # ২) Global API Key হিসেবে (email দরকার)
              if EMAIL:
                  data = req("/accounts", {"X-Auth-Email": EMAIL, "X-Auth-Key": value})
                  rows = data.get("result") or []
                  if data.get("success") and rows:
                      if not ACC:
                          ACC = rows[0]["id"]
                      lines.append(f"- {name}: ✅ WORK (Global API Key, {shape})")
                      chosen = {"name": name, "value": value, "mode": "global", "email": EMAIL, "account": ACC}
                      break
                  lines.append(f"- {name}: ❌ Global key হিসেবে চলল না ({shape})")
              else:
                  msg = ((data.get("errors") or [{}])[0].get("message") or "")[:60]
                  lines.append(f"- {name}: ❌ Bearer নয় ({shape}) · {msg}"
                               + (" · email নেই তাই Global পথ চেষ্টা করা যায়নি" if not EMAIL else ""))

          report = "\n".join(lines) or "- কিছুই পাওয়া যায়নি"
          if not chosen:
              report += (
                  "\n\n👉 কী করতে হবে:\n"
                  "  ১) https://dash.cloudflare.com/profile/api-tokens → একদম নিচে \"Global API Key\" → View → কপি\n"
                  "  ২) GitHub → Settings → Secrets → CF_API_KEY = ওই key\n"
                  "  ৩) CF_EMAIL = Cloudflare লগইন ইমেইল\n"
                  "  (অথবা \"Edit Cloudflare Workers\" টেমপ্লেট থেকে ৪০ অক্ষরের API Token — শুধু CF_API_TOKEN)"
              )
          print(report)
          with open("report.txt", "w", encoding="utf-8") as fh:
              fh.write(report + "\n")

          out = os.environ.get("GITHUB_ENV", "")
          with open(out, "a", encoding="utf-8") as fh:
              if chosen:
                  fh.write(f"CF_MODE={chosen['mode']}\n")
                  fh.write(f"CF_KEY_NAME={chosen['name']}\n")
                  fh.write(f"CLOUDFLARE_ACCOUNT_ID={chosen['account']}\n")
                  if chosen["mode"] == "bearer":
                      fh.write(f"CLOUDFLARE_API_TOKEN={chosen['value']}\n")
                  else:
                      fh.write(f"CLOUDFLARE_API_KEY={chosen['value']}\n")
                      fh.write(f"CLOUDFLARE_EMAIL={chosen['email']}\n")
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a", encoding="utf-8") as fh:
              if chosen and chosen["account"]:
                  fh.write("ok=true\n")
                  fh.write(f"mode={chosen['mode']}\n")
                  fh.write(f"keyname={chosen['name']}\n")
              else:
                  fh.write("ok=false\n")
                  fh.write("mode=-\n")
                  fh.write("keyname=-\n")
          PY

      - name: রিপোর্ট দেখাও
        if: always()
        run: |
          {
            echo "## 🔑 Cloudflare key যাচাই"
            echo ""
            echo '```'
            cat report.txt 2>/dev/null || echo "(রিপোর্ট নেই)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      # ---------- 🧪 টেস্ট ----------
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.ok == 'true'
        with:
          node-version: "22"

      - name: Worker টেস্ট
        if: steps.pick.outputs.ok == 'true'
        run: node tests/js/worker_check.mjs

      # ---------- 🚀 ডিপ্লয় ----------
      - name: Deploy → Cloudflare
        if: steps.pick.outputs.ok == 'true'
        working-directory: worker
        run: npx --yes wrangler@4 deploy

      - name: Worker-এ key গুলো বসাও (secret)
        if: steps.pick.outputs.ok == 'true'
        working-directory: worker
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MESH_GH_PAT: ${{ secrets.MESH_GH_PAT }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          set -uo pipefail
          put() {
            if [ -z "${2:-}" ]; then echo "⏭️ $1 নেই — বাদ"; return 0; fi
            if printf '%s' "$2" | npx --yes wrangler@4 secret put "$1" >/dev/null 2>&1; then
              echo "✅ $1 বসানো হলো"
            else
              echo "❌ $1 বসাতে পারলাম না"
            fi
          }
          put OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put OPENROUTER_API_KEY_2 "$OPENROUTER_API_KEY_2"
          put GROQ_API_KEY "$GROQ_API_KEY"
          put GEMINI_API_KEY "$GEMINI_API_KEY"
          put GITHUB_TOKEN "$MESH_GH_PAT"
          put APP_TOKEN "$APP_TOKEN"

      # ---------- 🔗 ঠিকানা ----------
      - name: ঠিকানা বের করো + যাচাই করো
        if: steps.pick.outputs.ok == 'true'
        id: url
        continue-on-error: true
        run: |
          set -uo pipefail
          HDR=(-H "Content-Type: application/json")
          if [ "${CF_MODE:-}" = "bearer" ]; then HDR+=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          else HDR+=(-H "X-Auth-Email: $CLOUDFLARE_EMAIL" -H "X-Auth-Key: $CLOUDFLARE_API_KEY"); fi
          SUB=$(curl -s "${HDR[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))" 2>/dev/null || true)
          if [ -z "$SUB" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ workers.dev subdomain পাওয়া গেল না (ড্যাশবোর্ড → Workers দেখুন)"
            exit 0
          fi
          URL="https://mesh-chat.$SUB.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🔗 ঠিকানা: $URL"
          sleep 5
          LAST=""
          for i in 1 2 3 4 5; do
            LAST=$(curl -s -m 20 "$URL/api/health" || true)
            if printf '%s' "$LAST" | grep -q '"ok":true'; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "✅ হেলথ ঠিক: $LAST"
              break
            fi
            echo "… অপেক্ষা ($i/5)"
            sleep 6
          done
          # 🩺 হেলথের আসল উত্তরটা রিপোর্টে রাখি (কেন fail হলো দেখার জন্য)
          {
            echo ""
            echo "------ /api/health ------"
            printf '%s\n' "$LAST"
          } >> report.txt

      - name: ⚡ আসল চ্যাট পরীক্ষা (কত সেকেন্ডে উত্তর)
        if: steps.url.outputs.found == 'true'
        continue-on-error: true
        run: |
          set +e
          URL="${{ steps.url.outputs.url }}"
          START=$(date +%s)
          curl -s -m 60 -X POST "$URL/api/chat" \
            -H "content-type: application/json" \
            -d '{"mode":"group","message":"এক লাইনে বলো: তুমি কাজ করছো কি না"}' > chat.txt
          SECS=$(( $(date +%s) - START ))
          JOBS=$(grep -o '"type":"agent_message"' chat.txt 2>/dev/null | wc -l)
          ERR=$(grep -o '"message":"[^"]*"' chat.txt 2>/dev/null | head -2)
          echo "⚡ ${SECS} সেকেন্ড · ${JOBS} ইভেন্ট"
          {
            echo ""
            echo "------ ⚡ chat smoke test ------"
            echo "seconds=$SECS events=$JOBS"
            [ -n "$ERR" ] && echo "errors: $ERR"
            grep -o '"type":"status","text":"[^"]*"' chat.txt 2>/dev/null | head -8 || true
            head -c 2000 chat.txt 2>/dev/null
            echo ""
          } >> report.txt
          if [ "${JOBS:-0}" -ge 2 ]; then
            echo "smoke=ok" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=weak" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: অ্যাপকে ঠিকানা জানাও (server.json)
        if: steps.url.outputs.found == 'true'
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -uo pipefail
          mkdir -p docs/app
          printf '{\n  "apiBase": "%s",\n  "note": "worker.yml নিজেই লিখেছে — অ্যাপ এখান থেকেই সার্ভারের ঠিকানা নেয়"\n}\n' "$URL" > docs/app/server.json
          git config user.name "mesh-bot"
          git config user.email "mesh-bot@users.noreply.github.com"
          git add docs/app/server.json
          if git diff --cached --quiet; then echo "কিছু বদলায়নি"; exit 0; fi
          git commit -m "chore(worker): অ্যাপের সার্ভার ঠিকানা $URL"
          git push || true

      # ---------- 📮 পড়া যায় এমন রিপোর্ট ----------
      - name: রিপোর্ট Issue #5-এ লেখো
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo "### ☁️ Cloudflare ডিপ্লয় — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- কাজ করা key: \`${{ steps.pick.outputs.keyname }}\` (mode: \`${{ steps.pick.outputs.mode }}\`)"
            [ -n "${{ steps.url.outputs.url }}" ] && echo "- ঠিকানা: ${{ steps.url.outputs.url }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```'
            cat report.txt 2>/dev/null || echo "(রিপোর্ট নেই)"
            echo '```'
          } > cf-report.md
          NO=$(gh issue list --label mesh-status --state open --json number -q '.[0].number' 2>/dev/null || true)
          [ -z "$NO" ] && NO=5
          gh issue comment "$NO" --body-file cf-report.md || true

      - name: সারসংক্ষেপ
        if: always()
        run: |
          {
            echo "## ☁️ Cloudflare Worker"
            echo ""
            echo "- key: \`${{ steps.pick.outputs.keyname }}\` · mode: \`${{ steps.pick.outputs.mode }}\`"
            if [ -n "${{ steps.url.outputs.url }}" ]; then
              echo "- 🔗 ${{ steps.url.outputs.url }}"
              echo "- ✅ অ্যাপে কিছু বসাতে হবে না (\`docs/app/server.json\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
