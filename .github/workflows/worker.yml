name: worker

# 🔄 recheck: 2026-10-25T16:20Z (টোকেন আবার যাচাই)

# ☁️ Cloudflare Worker — সম্পূর্ণ অটো ডিপ্লয় (কোনো ক্লিক নেই)
#
# 🔑 টোকেনের নাম যা-ই হোক, নিজেই খুঁজে নেয়:
#     ADMISSIONSKY_CLOUDFLARE_API_KEY  ← আপনার আগের secret
#     CF_API_TOKEN / CLOUDFLARE_API_KEY / CLOUDFLARE_API_TOKEN / CF_API_KEY
#   Account ID থাকলে ব্যবহার করে, নইলে API থেকে খুঁজে নেয়।
#
# তারপর এই workflow নিজেই —
#   ১) টোকেন যাচাই করে (দেখায় কী কী করতে পারে)
#   ২) Worker টেস্ট চালায়
#   ৩) deploy করে
#   ৪) OPENROUTER / GROQ / GEMINI key গুলো Worker-এর secret হিসেবে বসিয়ে দেয়
#   ৫) ঠিকানা বের করে docs/app/server.json-এ কমিট করে (অ্যাপ নিজেই নেবে)
#   ৬) /api/health দিয়ে যাচাই করে
# কোনো টোকেন না থাকলে চুপচাপ বাদ যায় (কিছু ভাঙে না)।

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  # 🔁 প্রতি ৬ ঘণ্টায় নিজেই আবার চেষ্টা করে — স্যার পরে key ঠিক করলেও আপনাআপনি ধরা পড়বে
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # docs/app/server.json কমিট করার জন্য
  issues: write   # টোকেন যাচাইয়ের রিপোর্ট Issue #5-এ দেখাতে

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ---------- 🔑 টোকেন খোঁজা ----------
      - name: Cloudflare টোকেন খুঁজে নাও (নাম যা-ই হোক)
        id: token
        env:
          T1: ${{ secrets.ADMISSIONSKY_CLOUDFLARE_API_KEY }}
          T2: ${{ secrets.CF_API_TOKEN }}
          T3: ${{ secrets.CLOUDFLARE_API_KEY }}
          T4: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T5: ${{ secrets.CF_API_KEY }}
          A1: ${{ secrets.CF_ACCOUNT_ID }}
          A2: ${{ secrets.ADMISSIONSKY_CLOUDFLARE_ACCOUNT_ID }}
          A3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          E1: ${{ secrets.CF_EMAIL }}
          E2: ${{ secrets.CLOUDFLARE_EMAIL }}
          E3: ${{ secrets.ADMISSIONSKY_CLOUDFLARE_EMAIL }}
        run: |
          set -uo pipefail
          TOK=""; NAME=""
          for n in ADMISSIONSKY_CLOUDFLARE_API_KEY CF_API_TOKEN CLOUDFLARE_API_KEY CLOUDFLARE_API_TOKEN CF_API_KEY; do
            v=""
            case "$n" in
              ADMISSIONSKY_CLOUDFLARE_API_KEY) v="${T1:-}" ;;
              CF_API_TOKEN) v="${T2:-}" ;;
              CLOUDFLARE_API_KEY) v="${T3:-}" ;;
              CLOUDFLARE_API_TOKEN) v="${T4:-}" ;;
              CF_API_KEY) v="${T5:-}" ;;
            esac
            if [ -n "$v" ]; then TOK="$v"; NAME="$n"; break; fi
          done
          ACC="${A1:-}${A2:-}${A3:-}"
          EMAIL="${E1:-}${E2:-}${E3:-}"
          if [ -z "$TOK" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ কোনো Cloudflare টোকেন নেই — ডিপ্লয় বাদ"
            exit 0
          fi
          echo "::add-mask::$TOK"
          {
            echo "found=true"
            echo "name=$NAME"
            echo "account=$ACC"
            echo "email=$EMAIL"
            printf 'token=%s\n' "$TOK"
          } >> "$GITHUB_OUTPUT"
          echo "✅ টোকেন পাওয়া গেছে: $NAME"

      # ---------- 🩺 যাচাই (কী কী করতে পারে দেখায়) ----------
      - name: টোকেন যাচাই করো
        id: verify
        if: steps.token.outputs.found == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          EMAIL: ${{ steps.token.outputs.email }}
        run: |
          set -uo pipefail
          python3 - <<'PY' > report.txt 2>&1 || true
          import json, os, urllib.request, urllib.error

          token = os.environ.get("TOKEN", "").strip()
          email = os.environ.get("EMAIL", "").strip()
          BASE = "https://api.cloudflare.com/client/v4"
          MODE = "bearer"

          def headers_for(mode):
              h = {"Content-Type": "application/json"}
              if mode == "global":
                  h["X-Auth-Email"] = email
                  h["X-Auth-Key"] = token
              else:
                  h["Authorization"] = f"Bearer {token}"
              return h

          def call(path, mode=None):
              req = urllib.request.Request(BASE + path, headers=headers_for(mode or MODE))
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  try:
                      body = json.loads(e.read().decode() or "{}")
                  except Exception:
                      body = {}
                  return e.code, body
              except Exception as exc:  # noqa: BLE001
                  return 0, {"errors": [{"message": str(exc)}]}

          status, data = call("/user/tokens/verify")
          ok = bool(data.get("success")) and (data.get("result") or {}).get("status") == "active"
          print(f"VERIFY mode=bearer ok={ok} status={status}")
          for err in (data.get("errors") or [])[:2]:
              print(f"  error: {err.get('message','')[:160]}")

          if not ok and email:
              MODE = "global"
              print("→ Bearer কাজ করল না; Global API Key (X-Auth-Key + email) দিয়ে চেষ্টা…")
              status, data = call("/accounts")
              ok = bool(data.get("success")) and bool(data.get("result"))
              print(f"VERIFY mode=global ok={ok} status={status}")
              for err in (data.get("errors") or [])[:2]:
                  print(f"  error: {err.get('message','')[:160]}")
          elif not ok:
              print("→ Bearer কাজ করল না, আর email নেই — তাই Global Key পথ চেষ্টা করা যায়নি")
              print("  সমাধান: Workers permission সহ নতুন token, অথবা CF_EMAIL secret যোগ করুন")

          accounts = []
          if ok:
              status, data = call("/accounts", MODE)
              accounts = data.get("result") or []
              print(f"ACCOUNTS ok={bool(data.get('success'))} count={len(accounts)}")
              for acc in accounts[:5]:
                  print(f"  - {acc.get('name','?')} ({acc.get('id','')})")
          with open("accounts.json", "w", encoding="utf-8") as fh:
              json.dump(accounts, fh)
          PY
          cat report.txt
          if grep -q "^VERIFY ok=True" report.txt; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "## 🔑 Cloudflare টোকেন যাচাই — \`${{ steps.token.outputs.name }}\`"
            echo ""
            echo '```'
            cat report.txt 2>/dev/null || echo "(রিপোর্ট নেই)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: রিপোর্ট আপলোড (দেখার জন্য)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cf-token-report
          path: |
            report.txt
            accounts.json
          if-no-files-found: ignore

      - name: রিপোর্ট Issue #5-এ লেখো (পড়া যায় এমন)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          [ -f report.txt ] || exit 0
          {
            echo "### ☁️ Cloudflare টোকেন যাচাই — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- secret: \`${{ steps.token.outputs.name || '(পাওয়া যায়নি)' }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```'
            cat report.txt
            echo '```'
          } > cf-report.md
          NO=$(gh issue list --label mesh-status --state open --json number -q '.[0].number' 2>/dev/null || true)
          [ -z "$NO" ] && NO=5
          gh issue comment "$NO" --body-file cf-report.md || true

      - name: Account ID ঠিক করো
        id: account
        if: steps.token.outputs.found == 'true' && steps.verify.outputs.ok == 'true'
        env:
          GIVEN: ${{ steps.token.outputs.account }}
        run: |
          set -uo pipefail
          ID="$GIVEN"
          if [ -z "$ID" ] && [ -f accounts.json ]; then
            ID=$(python3 -c "import json;d=json.load(open('accounts.json'));print(d[0]['id'] if d else '')" 2>/dev/null || true)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ -n "$ID" ]; then echo "✅ Account ID ঠিক হয়েছে"; else echo "❌ Account ID পাওয়া গেল না"; fi

      # ---------- 🧪 টেস্ট ----------
      - uses: actions/setup-node@v4
        if: steps.account.outputs.id != ''
        with:
          node-version: "22"

      - name: Worker টেস্ট
        if: steps.account.outputs.id != ''
        run: node tests/js/worker_check.mjs

      # ---------- 🚀 ডিপ্লয় ----------
      - name: Deploy → Cloudflare
        if: steps.account.outputs.id != ''
        env:
          CF_API_EMAIL: ${{ steps.token.outputs.email }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.token.outputs.token }}
          accountId: ${{ steps.account.outputs.id }}
          workingDirectory: worker
          command: deploy

      - name: Worker-এ key গুলো বসাও (secret)
        if: steps.account.outputs.id != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MESH_GH_PAT: ${{ secrets.MESH_GH_PAT }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          set -uo pipefail
          put() { # নাম, মান
            if [ -z "${2:-}" ]; then echo "⏭️ $1 নেই — বাদ"; return 0; fi
            if printf '%s' "$2" | npx --yes wrangler@4 secret put "$1" >/dev/null 2>&1; then
              echo "✅ $1 বসানো হলো"
            else
              echo "❌ $1 বসাতে পারলাম না"
            fi
          }
          put OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put OPENROUTER_API_KEY_2 "$OPENROUTER_API_KEY_2"
          put GROQ_API_KEY "$GROQ_API_KEY"
          put GEMINI_API_KEY "$GEMINI_API_KEY"
          put GITHUB_TOKEN "$MESH_GH_PAT"
          put APP_TOKEN "$APP_TOKEN"

      # ---------- 🔗 ঠিকানা + যাচাই ----------
      - name: ঠিকানা বের করো + যাচাই করো
        if: steps.account.outputs.id != ''
        id: url
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          ACC: ${{ steps.account.outputs.id }}
        run: |
          set -uo pipefail
          SUB=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" \
            | python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))" 2>/dev/null || true)
          if [ -z "$SUB" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ workers.dev subdomain পাওয়া গেল না"
            exit 0
          fi
          URL="https://mesh-chat.$SUB.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🔗 ঠিকানা: $URL"
          sleep 5
          for i in 1 2 3 4 5; do
            BODY=$(curl -s -m 20 "$URL/api/health" || true)
            if printf '%s' "$BODY" | grep -q '"ok":true'; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "✅ হেলথ ঠিক: $BODY"
              break
            fi
            echo "… অপেক্ষা ($i/5)"
            sleep 6
          done

      - name: অ্যাপকে ঠিকানা জানাও (server.json)
        if: steps.url.outputs.found == 'true'
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -uo pipefail
          mkdir -p docs/app
          printf '{\n  "apiBase": "%s",\n  "note": "worker.yml নিজেই লিখেছে — অ্যাপ এখান থেকেই সার্ভারের ঠিকানা নেয়"\n}\n' "$URL" > docs/app/server.json
          git config user.name "mesh-bot"
          git config user.email "mesh-bot@users.noreply.github.com"
          git add docs/app/server.json
          if git diff --cached --quiet; then echo "কিছু বদলায়নি"; exit 0; fi
          git commit -m "chore(worker): অ্যাপের সার্ভার ঠিকানা $URL"
          git push || true

      - name: সারসংক্ষেপ
        if: always()
        run: |
          {
            echo "## ☁️ Cloudflare Worker"
            echo ""
            echo "- টোকেন: \`${{ steps.token.outputs.name || '(পাওয়া যায়নি)' }}\`"
            echo "- যাচাই: \`${{ steps.verify.outputs.ok || '-' }}\`"
            if [ -n "${{ steps.url.outputs.url }}" ]; then
              echo "- 🔗 ঠিকানা: \`${{ steps.url.outputs.url }}\`"
              echo "- ✅ অ্যাপে কিছু বসাতে হবে না — \`docs/app/server.json\` থেকেই নেবে"
            fi
            echo "- ⚡ গতি: ৩–৮ সেকেন্ড (Actions-এর ৮–১০ মিনিটের বদলে)"
          } >> "$GITHUB_STEP_SUMMARY"
