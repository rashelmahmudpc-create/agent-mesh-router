name: agent-mesh

# 🧠 ব্রেইন এখানেই (GitHub Actions) — ম্যানেজার কোড এই রিপোতে থাকে।
# 📌 Issue এ `@mesh <কথা>` লিখলেই গ্রুপ চ্যাট শুরু; উত্তরগুলো ওই Issue-তেই comment হয়ে ফিরে আসে।
on:
  # 🚀 সবচেয়ে সহজ: `.mesh-run` ফাইলটা বদলালেই নিজে থেকে চলে (কোনো ক্লিক লাগে না)
  push:
    branches: [main]
    paths:
      - ".mesh-run"
  # ⏰ নিজে থেকে প্রতি ৬ ঘণ্টায়
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      message:
        description: "এজেন্টদের কী বলবেন?"
        required: true
        default: "হাই, নিজের পরিচয় দাও"
      mode:
        description: "কীভাবে চলবে?"
        type: choice
        default: direct
        options:
          - direct # ম্যানেজার কাজ ভাগ করে শুধু যার প্রযোজ্য তাকে ডাকে
          - group  # সবাই একসাথে উত্তর দেয় (গ্রুপ চ্যাট)
      dry_run:
        description: "শুধু পরীক্ষা (কোনো এজেন্ট চালাবে না)"
        type: boolean
        default: true
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mesh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    # Issue এ মালিক/সদস্য যেকোনো comment লিখলেই গ্রুপ চ্যাট শুরু হয়
    # (`@mesh` লেখা লাগে না; স্ট্যাটাস-লগ Issue বাদ)।
    # 🔒 পাবলিক রিপো: শুধু মালিক/সদস্য/কোলাবরেটরই ডাকতে পারবে — নইলে যে কেউ এসে API কোটা খরচ করে দেবে।
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment'
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && !contains(github.event.comment.body, '<!-- mesh:')
        && !contains(github.event.issue.labels.*.name, 'mesh-status'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # openhands-sdk এর শর্ত

      # Node 22 দরকার (Claude Code এর শর্ত)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        continue-on-error: true

      - name: ⚡ Cache (ইনস্টল দ্রুত করতে)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: mesh-clis-${{ runner.os }}-${{ hashFiles('config/agents.json') }}
          restore-keys: mesh-clis-${{ runner.os }}-

      - name: Install agent CLIs
        continue-on-error: true
        run: |
          npm install -g @opencode/cli || true              # opencode
          npm install -g @anthropic-ai/claude-code || true  # claude
          # ☤ Hermes — PyPI প্যাকেজ (যাচাই করা: hermes-agent 0.19.0)
          python -m pip install --user --quiet hermes-agent || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OpenHands SDK (ঐচ্ছিক)
        continue-on-error: true
        run: python -m pip install --user --quiet openhands-sdk openhands-workspace || true

      - name: Verify CLIs
        continue-on-error: true
        run: |
          for b in opencode claude hermes; do
            if command -v "$b" >/dev/null; then echo "✅ $b → $(command -v $b)"; else echo "❌ $b নেই"; fi
          done

      - name: Guard (key ছাড়া অটো-রান হবে না)
        id: guard
        env:
          K1: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$K1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ github.event_name }}" != "issue_comment" ]; then
            echo "⏭️ কোনো OpenRouter key নেই — অটো-রান বাদ দেওয়া হলো (খরচ বাঁচাতে)।"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔑 Key check (কোনটা সত্যিই কাজ করছে)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
          VERCEL_AI_GATEWAY: ${{ secrets.VERCEL_AI_GATEWAY }}
          VERCEL_AI_GETAWAY: ${{ secrets.VERCEL_AI_GETAWAY }}
          VERCEL_AI_GATEWAY_KEY: ${{ secrets.VERCEL_AI_GATEWAY_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_GATEWAY_KEY: ${{ secrets.VERCEL_GATEWAY_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          python -m mesh.cli --check-keys > keys.md 2>&1 || true
          {
            echo "## 🔑 Key check"
            echo ""
            cat keys.md
            echo ""
            echo "> 🔒 কোনো key-এর মান কোথাও ছাপা হয় না — শুধু কাজ করছে কি না।"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- keycheck ---"; cat keys.md

      - name: 🖐️ OpenHands কোটা (আজ কতবার)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        # 🖐️ আলাদা key-টেস্ট আর দরকার নেই: OpenHands এখন গ্রুপ চ্যাটেই উত্তর দেয় —
        #    সেই উত্তরটাই আসল প্রমাণ। এখানে শুধু দিনের হিসাব দেখাই।
        run: |
          {
            python -c "from mesh import dailycap; print(dailycap.summary())" 2>/dev/null || echo "(হিসাব নেই)"
            echo "সীমা: দিনে ২টা conversation (config/agents.json → openhands.daily_limit)"
          } | tee openhands.txt
          {
            echo "## 🖐️ OpenHands"
            echo ""
            echo '```'
            cat openhands.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Doctor (কে সাড়া দেবে?)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        # 🔍 ডক্টরকে একই secret গুলো দিতে হবে, নইলে ভুল করে "key নেই" বলে
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL }}
        run: |
          python -m mesh.cli --doctor > doctor.txt 2>&1 || true
          {
            echo "## 🩺 ডক্টর"
            echo '```'
            cat doctor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pick free models (প্রতিটা রানে তাজা তালিকা দেখে)
        id: freemodel
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        # 🧪 শুধু তালিকায় থাকলেই হয় না — ১ টোকেনের ছোট পরীক্ষা দিয়ে দেখে নিই মডেল সত্যিই সাড়া দেয় কি না
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m mesh.cli --free-model-list 3 > free-model.txt 2>/dev/null || true
          i=1
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            echo "FREE_M$i=$m" >> "$GITHUB_ENV"
            i=$((i+1))
          done < free-model.txt
          FIRST=$(head -1 free-model.txt 2>/dev/null || true)
          if [ -n "$FIRST" ]; then
            [ -z "${CLAUDE_MODEL:-}" ] && echo "CLAUDE_MODEL=$FIRST" >> "$GITHUB_ENV"
            [ -z "${OPENCODE_FALLBACK_MODEL:-}" ] && echo "OPENCODE_FALLBACK_MODEL=$FIRST" >> "$GITHUB_ENV"
            echo "✅ আজকের ফ্রি মডেল: $(paste -sd' ' free-model.txt)" >> "$GITHUB_STEP_SUMMARY"
            echo "free: $(paste -sd' ' free-model.txt)"
          else
            echo "⚠️ ফ্রি মডেল পাওয়া যায়নি — ডিফল্ট চেইন" >> "$GITHUB_STEP_SUMMARY"
            echo "free: (none)"
          fi

      - name: Hermes শুধু আসল উত্তর দেবে (reasoning বক্স বন্ধ)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        # 🧠 reasoning বক্স খোলা থাকলে উত্তরটাই হারিয়ে যেত — বন্ধ করে দিই
        run: |
          if hermes config set display.show_reasoning false >/dev/null 2>&1; then
            echo "✅ Hermes reasoning display বন্ধ"
          else
            CFG="$HOME/.hermes/config.yaml"
            mkdir -p "$HOME/.hermes"; touch "$CFG"
            if ! grep -q '^display:' "$CFG"; then
              printf '\ndisplay:\n  show_reasoning: false\n' >> "$CFG"
              echo "✅ config.yaml এ display.show_reasoning=false যোগ হলো"
            else
              echo "⚠️ hermes config set কাজ করল না, display ব্লক আগেই আছে"
            fi
          fi
          hermes config get display.show_reasoning 2>/dev/null || true

      - name: Show team
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python -m mesh.cli --list | tee team.txt

      - name: Route message
        if: steps.guard.outputs.skip != 'true'
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL }}
          MSG: ${{ inputs.message || github.event.comment.body || 'সবাই, এক লাইনে নিজের অবস্থা জানাও' }}
          MODE: ${{ inputs.mode || 'group' }}
          ISSUE: ${{ github.event.issue.number || '' }}
          DRY: ${{ inputs.dry_run || false }}
        run: |
          set -uo pipefail
          # 🏠 অটো-রান (push/schedule)-এও উত্তরগুলো হলঘর Issue #3-এ যাবে, যাতে স্যার দেখতে পান
          HALL=3
          if [ -z "${ISSUE:-}" ] && [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            ISSUE="$HALL"
          fi
          args=(--mode "$MODE")
          if [ -n "$ISSUE" ]; then args+=(--issue "$ISSUE"); fi
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          echo "▶️ mode=$MODE dry=$DRY issue=${ISSUE:-none}"
          python -m mesh.cli "$MSG" "${args[@]}" 2>&1 | tee mesh-output.txt
          {
            echo "## 🧠 মেশ রান"
            echo ""
            echo "- mode: \`$MODE\` · dry_run: \`$DRY\` · issue: ${ISSUE:-none}"
            echo ""
            echo '```'
            cat mesh-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: 💾 দিনের হিসাব সেভ (পরের রান যেন জানে)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        # কোটা-খরচা এজেন্টের হিসাব repo-তে থাকে, নইলে প্রতিটা রান শূন্য থেকে শুরু করে
        run: |
          set -uo pipefail
          if [ ! -f .mesh-daily.json ]; then exit 0; fi
          git add .mesh-daily.json
          if git diff --cached --quiet; then echo "কিছু বদলায়নি"; exit 0; fi
          git config user.name "mesh-bot"
          git config user.email "mesh-bot@users.noreply.github.com"
          git commit -m "chore: আজকের এজেন্ট কোটা $(date -u '+%Y-%m-%d')"
          git push || true

      - name: Publish status to an Issue (পড়া যায় এমন লগ)
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo "### 🧠 mesh run — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- trigger: \`${{ github.event_name }}\` · status: \`${{ job.status }}\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- free model: \`$(head -3 free-model.txt 2>/dev/null | paste -sd' ' - || echo '(none)')\`"
            echo ""
            echo "<details><summary>🩺 ডক্টর</summary>"
            echo ""
            echo '```'
            cat doctor.txt 2>/dev/null || echo "(ডক্টর চলে নি)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>🔑 Key check</summary>"
            echo ""
            cat keys.md 2>/dev/null || echo "(চলে নি)"
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>🖐️ OpenHands কোটা</summary>"
            echo ""
            echo '```'
            cat openhands.txt 2>/dev/null || echo "(হিসাব নেই)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>📋 উত্তর</summary>"
            echo ""
            echo '```'
            cat mesh-output.txt 2>/dev/null || echo "(উত্তর নেই)"
            echo '```'
            echo "</details>"
          } > status.md
          if ! gh issue list --label mesh-status --state open --json number -q '.[0].number' > issue.txt 2>/dev/null; then
            echo "" > issue.txt
          fi
          ISSUE_NO=$(head -1 issue.txt | tr -d '[:space:]')
          if [ -z "$ISSUE_NO" ]; then
            gh label create mesh-status --color BFD4F2 --description "mesh health log" 2>/dev/null || true
            gh issue create --title "🩺 mesh status log" --label mesh-status --body-file status.md || true
          else
            gh issue comment "$ISSUE_NO" --body-file status.md || true
          fi

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-log
          path: |
            mesh-output.txt
            doctor.txt
            team.txt
            openhands.txt
            status.md
            .mesh/transcript.jsonl
          if-no-files-found: ignore

# 💡 ২৪/৭ চালু রাখতে চাইলে (৬০ দিন নিষ্ক্রিয় থাকলে শিডিউল বন্ধ হয়ে যায় — তাই বাইরে থেকে
#    cron-job.org দিয়ে workflow_dispatch API কল করাই ভালো):
#
#  schedule:
#    - cron: "0 */6 * * *"
