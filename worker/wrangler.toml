# 🔌 এজেন্ট টিম — Cloudflare Worker সেটিংস
# গোপন তথ্য এখানে নয় → `wrangler secret put ...`

name = "mesh-chat"
main = "index.js"
compatibility_date = "2026-01-01"

[vars]
MESH_REPO = "rashelmahmudpc-create/agent-mesh-router"
MESH_ISSUE = "3"
ALLOWED_ORIGIN = "*"

# 🔑 একবার করে চালান (টার্মিনালে):
#   npx wrangler secret put GITHUB_TOKEN    # fine-grained PAT, Issues: Read & Write
#   npx wrangler secret put APP_TOKEN       # অ্যাপের সেটিংসে যে টোকেন বসাবেন
# তারপর:
#   npx wrangler deploy

